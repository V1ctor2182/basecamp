spec_id: "intent-04-career-system-09-integrations-credentials-001"
type: intent
state: active
intent:
  summary: "Settings → Integrations 页统一管 Anthropic / Google OAuth / GitHub 凭证,不再手编 config.json 或 .env"
  detail: |
    操作者在 dashboard 内打开 Settings → Integrations,可以:
      - 设置 / 替换 / 清除 Anthropic API key (供 Stage B / tailor /
        飞轮 inducer / classifier 使用);
      - 设置 / 替换 / 清除 Google OAuth clientId + clientSecret (供
        Google Doc resume sync 使用);
      - 设置 / 替换 / 清除 GitHub username + token (供 Tracker app 调
        GitHub API)。

    要求:
      1. 三类凭证统一落 data/config.json (已 gitignored — `data/*.json`);
         不引新文件 / 新存储。
      2. Anthropic key: 当前 anthropicClient.mjs 只读 env, 这次补
         config.json 兜底, 模式参考 server.mjs 已有的
         `process.env.GOOGLE_CLIENT_ID || config.googleClientId`。
      3. Masked display: GET endpoint 永远返回 {set:bool, masked:'sk-
         ...abcd'}, 从不回显完整密钥。前端永远不持有原始 key。
      4. Atomic write: PUT 走 tmp + rename, 避免并发改坏 config。
      5. PUT 后立即 invalidate anthropic client cache (复用现有的
         _resetClientForTesting), 让新 key 即时生效不用重启 server。

    UX:
      - 三个卡片(Anthropic / Google OAuth / GitHub)并列,各管自己的字段。
      - 每个字段显示:status pill (set/unset) + masked value (set 时) +
        Edit / Clear / Save 三种动作。
      - 修改后 toast 反馈, 失败不静默(no silent errors)。
constraints: []
indexing:
  type: intent
  priority: P1
  layer: feature
  domain: career-settings
  tags: [settings, credentials, oauth, anthropic, github, config]
provenance:
