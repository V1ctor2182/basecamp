    description: |
      扩现有 GET /api/config 让它一并返回 anthropic + google OAuth 的 masked
      状态(沿用现有 endpoint,不开新路由);扩 PUT 接 anthropicApiKey /
      googleClientId / googleClientSecret 的 partial update(空串 = 清除)。
      anthropicClient.mjs 的 getClient() 加 env → data/config.json 兜底
      (平行 server.mjs:2562 的 GOOGLE_CLIENT_ID 模式)。PUT 后立即调
      _resetClientForTesting() 让 cache 失效,新 key 不重启即生效。
      maskSecret(value, lastN=4) helper 加在 server.mjs(短串 <8 全屏蔽)。
      新增 smoke-config-endpoint.mjs:GET masked 形状、PUT round-trip、
      空串清除、anthropic cache invalidation 验证。

  - id: "m2-frontend-integrations-page"
