    status: completed
    estimated_files:
      - "src/career/settings/Integrations.tsx"
      - "src/career/settings/integrations.css"
      - "src/career/settings/SettingsLayout.tsx"
      - "src/CareerApp.tsx"
    estimated_lines: 180
    depends_on: ["m1-backend-config"]
    complexity_flags: []
    open_questions: []
    description: |
      新建 Integrations.tsx — 3 张卡片(Anthropic / Google OAuth / GitHub)
      并列。每张卡片有:status pill(set/unset)、masked value(set 时显示
      末 4 位)、Edit / Save / Clear 三种动作、保存成功/失败 toast。
      SettingsLayout 加 "Integrations" NavLink 放最后;CareerApp.tsx 加
      Route<integrations>。CSS 沿用 c-resumes-* / Identity.tsx 视觉。
      错误一律 inline 显示(no silent errors)。本 milestone 不含
      Test Connection — 那是 m3。

  - id: "m3-test-connection"
    name: "Test Connection — 后端 /test 端点 + 前端 Test 按钮 + smoke"
    status: completed
    estimated_files:
      - "server.mjs"
      - "src/career/settings/Integrations.tsx"
      - "scripts/smoke-config-endpoint.mjs"
    estimated_lines: 170
    depends_on: ["m2-frontend-integrations-page"]
    complexity_flags:
      - "external_api"
    open_questions: []
    description: |
      新增 POST /api/career/config/:service/test(service ∈
      anthropic|google|github):
        - anthropic: 真发 1-output-token 的 claude-haiku-4-5 ping
          (约 $0.0001/次), catch AuthenticationError → 区分 auth /
          rate_limit / network / other 错误;
        - google: 不跑真 OAuth(那是 Resumes Sync 的活),只校验格式
          (clientId 匹配 *.apps.googleusercontent.com、clientSecret
          匹配 GOCSPX-*);
        - github: 带 token 调 GitHub GET /user, 返 login 验真。
      前端每张卡片加 Test 按钮 → loading state → ✅/❌ pill + 错误 detail
      inline。smoke 覆盖 3 个 service 各 1 个 happy + 1 个 fail path
      (mock anthropic, fake github fetch)。

