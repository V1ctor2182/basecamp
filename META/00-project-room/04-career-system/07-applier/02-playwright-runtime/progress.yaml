      submit-first loop 的"提交 + 探测"原语。
      被 04-multi-step/m6 SUBMITTING + PARSING_ERRORS states(Phase 1)消费。

      3 个 export:

      1) submitForm(page, adapter?) → {
           outcome: 'submitted' | 'has_errors' | 'next_step' | 'timeout',
           url_after?: string,
           elapsed_ms: number,
         }
         - 找 submit button:adapter.submit_button.name_hints fallback to has-text("Submit|Apply")
         - humanClick(button)(per existing humanize.mjs)
         - race 90s(per P2-OQ6 + Phase 1/OQ9):
             URL change | inline error appears | next-step DOM appears | timeout
         - 90s 沉默 → outcome='timeout'

      2) parseFormErrors(page, adapter?) → [{field, error_code, error_msg}]
         跨 ATS 通用 selectors(per Phase 1/OQ4):
           · [role=alert]
           · .error, .field-error, .help-block.is-invalid
           · aria-describedby chain(每个 invalid input 的 aria-describedby 指向 error msg)
         per-adapter override:adapter.error_selectors(defer 到 Phase 6 实际配)
         field 名提取:input.name || closest('label') || aria-label
         error_code 推断:
           "Required|This field is required"            → 'required'
           "format|invalid|must match"                  → 'invalid_format'
           "must be|size|MB|KB|too large|too big"       → 'too_large'
           "must be at least|minimum|short"             → 'too_short'
           其他                                          → 'custom'
         无 error → 返 [](per P2-OQ5)

      3) detectSubmitSuccess(page, adapter?) → bool
         三选一即 true:
           · URL pattern(`/thank-you`, `/confirmation`, `/success`)
           · thank-you text(adapter.success_text default `["Thank you", "Application received"]`)
           · 监听到 POST /applications 200 + redirect(navigation event listener)

      smoke 14 case:
        submitForm:
          1. happy submit → URL change → outcome='submitted'
          2. inline error 出现 → outcome='has_errors'
          3. next-step appears → outcome='next_step'
          4. 90s timeout → outcome='timeout'
          5. submit button 找不到 → throw 明确 error
        parseFormErrors:
          6. generic [role=alert] 提取
          7. aria-describedby 配对
          8. error_code 推断 5 种 pattern
          9. 无 error 返 []
          10. per-adapter override 注入(mock greenhouse.yml.error_selectors)
        detectSubmitSuccess:
          11. URL pattern match
          12. thank-you text match
          13. 200 + redirect 监听
          14. 全 false → 返 false

