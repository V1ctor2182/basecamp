    description: |
      Phase 3 Apply.tsx UI 用的原语 — 观察用户在 Chromium 的动作 + 主动引导他到字段。

      observer.mjs(~160 LOC):
        attachFormObserver(page, formSelector, callback) → detach()
          via page.addInitScript + page.exposeBinding('__applierFormEvent'):
            - 浏览器内挂 MutationObserver 监听 formSelector 内的 input/change events
              (per P2-OQ7,不监听 blur)
            - debounce 200ms per element(per P2-OQ8)
            - Node 端 callback({ field_ref, value, event_type })
          detach() 拆 observer,清 exposeBinding

        关键:只监听 formSelector 区域,不监听 document(避免 React re-render 风暴)

      interact.mjs(~120 LOC):
        focusField(page, ref|locator) → void
          - scrollIntoView(behavior: 'smooth', block: 'center')
          - locator.evaluate(el => el.setAttribute('data-applier-focus', '1'))
          - 注入 CSS via addStyleTag(once per page):
              [data-applier-focus] { outline: 2px solid #d33; outline-offset: 2px }
            (per P2-OQ9)
          - locator.focus() if input-like

        resetField(page, ref|locator, kind?) → void
          kind 可选 hint,缺省自动判:
            - <input type=text/email/tel> → fill('')
            - <select> → selectOption({ index: 0 })
            - <input type=file> → setInputFiles([])
            - 自定义 widget(role=combobox)→ focus + Ctrl+A + Delete + blur
              (per P2-OQ10)
