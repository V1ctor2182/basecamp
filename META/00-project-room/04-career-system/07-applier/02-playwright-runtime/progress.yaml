      按 ladder 顺序试 5 种 strategy fill,每条 verify 完再决定下一步。
      被 04-multi-step/m6 RETRYING_FIX state(Phase 1)消费。

      API:
        fillWithFallback(page, ref|locator, expected, options) → {
          strategies_tried: [{name, result, verify_value?}],
          final: { strategy: string, success: bool, last_value?: string },
        }

      Ladder(per P2-OQ1 硬编码,adapter override defer Phase 6):
        1. selectOption        — Playwright 原生 <select>
        2. react_select_click  — control click → option click(React-Select 类)
        3. keyboard_input      — focus → keyboard.type → Enter
        4. role_locator_click  — getByRole('option', {name}).click
        5. aria_combobox       — aria-activedescendant pattern

      Each strategy 独立 file ≤ 40 LOC,export { name, async fill(locator, value, page?) }。
      失败的 strategy 在下一条前自动 reset(per P2-OQ2,简单 clear;深度 reset 在 m6 提供)。
      first-success 立刻返(per P2-OQ4);全 fail 返 final.success=false。
      verify(per P2-OQ3): readValue().trim().toLowerCase() === expected.trim().toLowerCase()。

      smoke 12 case:
        1-5: 每种 strategy 独立成功 path
        6:  全 fail
        7:  selectOption 失败 → react_select_click 成功(典型 Greenhouse EEO)
        8:  fill 成功但 verify 不通过(填 "Y" 期望 "Yes")→ 继续 ladder
        9:  reset 之间不串影响(strategy A 失败状态不污染 strategy B)
        10: timeout per strategy(单 strategy 最多 3s)
        11: ref invalid → 立刻返 fail,不试 ladder
        12: ladder 自定义覆盖 default(adapter override 钩子保留,本 m4 不实际接 adapter)

