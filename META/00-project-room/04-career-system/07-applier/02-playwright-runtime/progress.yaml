      smoke 11 case:
        observer:
          1. attach + 模拟 input event → callback 触发 once
          2. debounce 200ms 内多次 input → callback 触发 once(取最后 value)
          3. event 在 form 外 → 不触发 callback
          4. detach 之后 input event → callback 不触发
          5. 同一 page 多次 attach → 互不干扰
        focusField:
          6. scroll 后字段在 viewport center
          7. outline 红框 inject(check element 的 computed style)
          8. focus 真触发 :focus 状态(check document.activeElement)
        resetField:
          9. text input clear
          10. select dropdown reset to index 0
          11. file input setInputFiles([]) 清空

