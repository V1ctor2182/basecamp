e 5 (flywheel ingestion of strategies_tried[] signal A). \n\n--- ORIGINAL Phase 1 ROOM REOPEN NOTE 2026-05-27 ---\n\n🔄 ROOM REOPEN 2026-05-27 — Phase 1 of post-fill-handoff-ux design adds m5/m6/m7 (submit-first error loop + 5 guards + envelope schema v2). m1-m4 (153/153 smoke) remain ✅. All 9 plan-milestones open questions locked with defaults (per session 2026-05-27): same-error compared by (field, error_code) tuple, max submits hardcoded 3, submit interval since-last-submit-no-pause, form_errors parsed via generic selectors with adapter-rule fallback deferred to Phase 6, auto-retry-after-fix (UI shows attempt progress), _fixField via DI mock until Phase 2 ships fillWithFallback, escalation locks out further submit (control to user), Zod .default([]) auto-migrates old sessions without submit_attempts[], 90s form-silence threshold for timeout escalation. Estimated work: m5=210 LOC (60 src + 150 smoke, pure data layer), m6=660 LOC (310 src + 350 smoke, state machine + 5 guards in independent guards/*.mjs files + policy.mjs dispatcher), m7=140 LOC (40 src + 100 smoke + spec update). Cross-room dep: m6 RETRYING_FIX state calls 02-playwright-runtime/m5 fillWithFallback (Phase 2 of the design doc) — Phase 1 m6 uses DI mock; real wire-up happens during Phase 2 dev. \n\n--- ORIGINAL m4 ROOM COMPLETE NOTE ---\n\n🎉 ROOM COMPLETE 2026-05-13 (4/4 milestones). One-day Room. m4 shipped — endpoint.mjs ~310 LOC (in-memory _machines registry per jobId + pending-Promise approve resolver + startMachine/approveStep/pauseMachine/resumeMachine/getStatus + Zod body schemas StartBodySchema/ApproveStepBodySchema/ResumeBodySchema) + server.mjs +120 LOC (5 routes: POST start, GET :jobId/status, POST :jobId/approve-step, POST :jobId/pause, POST :jobId/resume; JOB_ID_RE shared with m1; URL/body jobId mismatch check on resume) + smoke-multistep-endpoint.mjs ~780 LOC, 30/30 green. All page-touching deps injected via _runMachine + _getPage so smoke runs pure-Node. Plan-agent Phase 3.5 review: 0 CRITICAL + 2 HIGH + 5 MEDIUM + 8 LOW — applied 2H + 2M + 4L (H1 synchronous slot reservation prevents concurrent-start race [orphan ctrl + double machine spawn], H2 lastDraftInfo snapshot preserved across approveStep/pauseMachine/settle paths for dashboard 'errored at step N' UX, M1 resume-of-completed returns 409 not 200 [terminal state shouldn't pretend to spawn], M4 done-state ctrl swept from registry on next start within 30s grace, L1 import JOB_ID_RE from m1 store [drift prevention], L2 URL vs body jobId explicit mismatch check, L5 pauseRequested flag for pause-before-first-approve [next approve auto-declines], L6 cleaned stale 'reject' comment). Deferred M2 (detectAdapterForUrl substring duplicate — m2 supersedes via lazy import in production wiring), M3 (resume drops classifier ctx — documented; would need session schema change), M5 (redactSession no-op — dashboard local-only, masking TBD when 08 ships UI), L3/L4/L7/L8 hygiene. Smoke covers: 3 Zod schemas + strict rejection + null-edit, startMachine happy + 503 + 409 duplicate, approveStep 404 + 409 + 400 + edits propagation, pauseMachine + 404 + 400, getStatus 404 + 200 + 400, resumeMachine paused + 404 + 410 abandoned + 409 already-running + 409 completed-terminal, 2 e2e choreographies (start→approve×3→completed, start→approve→pause→resume→complete), H1 concurrent-start race (exactly one wins), L5 pause-before-first-approve auto-declines, M4 restart after error within grace, H2 lastDraftInfo after settle. Room regression: m1 43 + m2 43 + m3 37 + m4 30 = **153/153 green** all milestones. ROOM COMPLETE rollups applied: room.yaml lifecycle planning→active, _tree.yaml multi-step planning→active, 07-applier parent 50%→62% (5/8 children ✅), 04-career-system 90%→92% (27/34 features). 下游 unblocked: 05-non-standard-controls (extends machine action verbs for weird widgets), 06-site-adapters (replaces m2 inline mini-registry — same shape contract), 08-human-gate-tracker/03+/04 (consumes /multi-step/:jobId/status + POST