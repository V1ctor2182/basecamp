    description: |
      Submit-first error loop 的核心。state machine 加 5 个新 state +
      policy 模块编排 5 个 guard,任一触发 → ESCALATING_TO_USER。

      新 states:
        SUBMITTING / PARSING_ERRORS / RETRYING_FIX / SUBMITTED_SUCCESS / ESCALATING_TO_USER

      Transitions:
        (final step approved) → submitting
        submitting → submitted_success         (无 error)
        submitting → parsing_errors            (form 返 inline errors)
        parsing_errors → retrying_fix          (policy.evaluate() → can_fix)
        parsing_errors → escalating_to_user    (policy.evaluate() → escalate, reason)
        retrying_fix → submitting              (loop 回去)

      Guards(每个独立 file ≤ 25 LOC,policy 按下列优先级 evaluate):
        1. parseFailure        — form_errors 解析失败 → escalate(最高优,因为后续 guard 没数据可用)
        2. allStrategiesFailed — 任一 field final_state = 'all_strategies_failed' → escalate
        3. sameErrorTwice      — 同 (field, error_code) tuple 出现 ≥ 2 次 → escalate
        4. maxSubmits          — submit_attempts.length ≥ 3 → escalate(per OQ2 硬编码)
        5. submitInterval      — last_submit_at < now - 5s → wait(per OQ3 不暂停)

      policy.mjs:
        evaluateGuards(session, currentErrors) → {
          action: 'fix' | 'escalate' | 'wait',
          reason?: string,            // 必填 when escalate
          wait_until?: ISO datetime,  // 必填 when wait
        }
        按上面优先级跑,first-match 决定。

      RETRYING_FIX 调 _fixField DI(per OQ6,Phase 2 ship 前用 mock):
        _machineDeps.fixField(page, field, error) → { result, strategy_used }
        smoke 默认用 always-fail mock,逐 guard 路径测;一个 case 用 always-succeed mock 验证 happy loop。

      smoke 10 个 case:
        1. happy: 1 次 submit 无 error → submitted_success
        2. 1 次 fix 后 submit 成功(attempt 2)
        3. sameErrorTwice trigger → escalate
        4. maxSubmits trigger → escalate(同一 fingerprint 反复失败但不同 error code)
        5. allStrategiesFailed trigger → escalate(_fixField 返 all_strategies_failed)
        6. parseFailure trigger → escalate(mock parser 抛错)
        7. submitInterval wait → 真等 5s 后才 submit(用 fake timer)
        8. escalation 之后再调 step → 拒绝(per OQ7,403)
        9. 老 session(无 submit_attempts)加载后 loop 正常工作
        10. form 沉默 90s → escalate(per OQ9 timeout)

      Locked design:
        - guards/ 独立 file:每个 guard ≤ 25 LOC + 自己单测;
          以后 site-specific guard(e.g. workday-rate-limit)只是新加 file。
        - policy 优先级 hard-coded(per OQ2 简单优先),adapter override defer Phase 6。
        - escalation_reason 是结构化 enum + free-text:
          { code: 'same_error' | 'max_submits' | ..., detail: string, field?: string }
          UI(Phase 3 Apply.tsx)按 code 选展示模板,detail 给上下文。

