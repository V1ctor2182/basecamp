<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Test Engineering Role — Apply</title>
</head>
<body>
  <main>
    <h1>Apply for: Test Engineering Role</h1>
    <p>Single-step Greenhouse-style application form.</p>

    <form id="apply-form" method="post" action="/thank-you">
      <fieldset>
        <label for="first_name">First Name *</label>
        <input id="first_name" name="first_name" type="text" required />

        <label for="last_name">Last Name *</label>
        <input id="last_name" name="last_name" type="text" required />

        <label for="email">Email *</label>
        <input id="email" name="email" type="email" required />

        <label for="phone">Phone *</label>
        <input id="phone" name="phone" type="tel" required />

        <label for="linkedin">LinkedIn</label>
        <input id="linkedin" name="linkedin" type="url" />

        <label for="cover_letter">Cover Letter</label>
        <textarea id="cover_letter" name="cover_letter" rows="4"></textarea>

        <label for="why">Why do you want this role?</label>
        <textarea id="why" name="why" rows="3"></textarea>

        <label for="visa">Will you require visa sponsorship? *</label>
        <select id="visa" name="visa" required>
          <option value="">— select —</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>

        <label for="resume">Resume *</label>
        <input id="resume" name="resume" type="file" required />
      </fieldset>

      <button type="submit" id="submit-btn">Submit Application</button>
    </form>
  </main>

  <script>
    // Intercept submit to navigate to a thank-you URL (so detectSubmitSuccess
    // matches `url_pattern` against /thank-you). We don't actually POST.
    document.getElementById('apply-form').addEventListener('submit', (e) => {
      e.preventDefault();
      // Mark visible thank-you text so detectSubmitSuccess can match
      // either url_pattern OR thank_you_text.
      document.body.innerHTML = '<h1>Thank you for your application!</h1>' +
        '<p>We have received your submission.</p>';
      history.pushState({}, '', '/thank-you');
    });
  </script>
</body>
</html>
