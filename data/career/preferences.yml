targets:
  - title: Software Engineer
    seniority: IC4
    function: Backend
  - title: Applied AI Engineer
    seniority: IC4
comp_target:
  base_min: 160000
  base_max: 220000
  total_min: 200000
  total_max: 320000
  currency: USD
location:
  accept_any: false
  remote_only: false
  hybrid_max_days_onsite: 3
  preferred_cities:
    - New York, NY
    - San Francisco, CA
    - Seattle, WA
  acceptable_countries:
    - United States
hard_filters:
  source_filter:
    blocked_sources:
      - linkedin
      - indeed
  company_blocklist:
    - Palantir
  title_blocklist:
    - Embedded
    - Firmware
    - Game Developer
  title_allowlist: []
  location:
    allowed_countries:
      - United States
      - Canada
    allowed_cities: []
    disallowed_countries: []
  seniority:
    allowed:
      - IC3
      - IC4
      - IC5
      - Senior
      - Staff
  posted_within_days: 15
  comp_floor:
    base_min: 120000
    currency: USD
  jd_text_blocklist:
    - No sponsorship
    - No visa sponsorship
    - Must be US citizen
    - Secret clearance required
  disabled_rules:
    - seniority
    - comp_floor
soft_preferences:
  company_types:
    - startup
    - scaleup
    - bigco
  remote_culture:
    - async-first
    - remote-ok
  tech_stack_preferred:
    - Python
    - Go
    - TypeScript
  tech_stack_avoid:
    - PHP
    - legacy Java
  industries_preferred:
    - AI infra
    - devtools
    - fintech
  industries_avoid:
    - adtech
    - crypto
    - gambling
scoring_weights:
  tech_match: 0.3
  comp_match: 0.2
  location_match: 0.15
  company_match: 0.2
  growth_signal: 0.15
thresholds:
  strong: 4.5
  worth: 4
  consider: 3.5
  skip_below: 3
evaluator_strategy:
  stage_a:
    enabled: true
    model: claude-haiku-4-5
    threshold: 3.5
  stage_b:
    enabled: true
    model: claude-sonnet-4-6
    blocks:
      block_b: true
      block_c: false
      block_d: false
      block_e: true
      block_f: false
      block_g: false
      block_d_websearch: true
      block_f_story_count: 8
      block_g_playwright: true
    daily_budget_usd: 10
applier:
  auto_approve_when_safe: false
